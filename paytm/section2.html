<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        font-family: sans-serif;
        background-color: whitesmoke;
      }
      .credit-paytm-containeer{
        display: flex;
        gap: 20px;
        margin: 3;
      }
      .credit-card-containeer {
       /* border: 2px solid black;*/
        padding: 5% 4% 3%;
        border-radius: 15px;
      }
      .credit-card-containeer .cards-image {
        width: 20%;
      }
      .credit-card-containeer .bank-image {
        width: 40%;
      }
      .credit-card-containeer .rupay-cards {
        width: 100%;
      }
      .apply {
        display: flex;
      }
      .apply a {
        color: navy;
        border: 1px solid navy;
        padding: 10px;
        border-radius: 999px;
        text-decoration: none;
        margin-right: 20px;
      }
      .apply a:hover {
        color: white;
        background-color: navy;
      }
      .saii{
        background-image: url(https://assetscdn1.paytm.com/images/catalog/view_item/1725638720587.png);
        

      }
      .family{
            background: linear-gradient(#D3F5FF, #FFFFFF);
      }
    </style>
  </head>
  <body>
    <div class="credit-paytm-containeer">
      <div class="credit-card-containeer saii">
        <img
          class="cards-image"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2988623/27221716933469500.png"
          alt=""
        />
        <h1>
          One destination for <br> <span style="color: skyblue"> Credit Cards </span>
        </h1>
        <p>
          Paytm HDFC, SBI Card & Axis Bank Credit Card with <br>assured Cashback and
          incredible offers.
        </p>
        <div class="apply">
          <a href="">Apply Now <i class="fa-solid fa-right-long"></i></a>
          <img
            class="bank-image"
            src="https://assetscdn1.paytm.com/images/catalog/view_item/1741675100265.png"
            alt=""
          />
        </div>
        <img
          class="rupay-cards"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2988623/27221716933469500.png"
          alt=""
        />
        <!-- <img src="https://assetscdn1.paytm.com/images/catalog/view/1763534762757.jpg" alt=""> -->
      </div>
        <div class="credit-card-containeer family">
        <img
          class="cards-image"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2834804/1725623952233.png"
          alt=""
        />
        <h1>
         Insurance ka<br><span style="color: skyblue">Super Market</span>
        </h1>
        <p>
          A Smart, Simple & Transparent Platform to Explore &<br>Purchase Insurance.
        </p>
        <div class="apply">
          <a href="">Get it Now<i class="fa-solid fa-right-long"></i></a>
          
        </div>
        <img
          class="rupay-cards"
          src="https://assetscdn1.paytm.com/images/catalog/view_item/2988624/27217428616091880.png"
          alt=""
        />
        <!-- <img src="https://assetscdn1.paytm.com/images/catalog/view/1763534762757.jpg" alt=""> -->
      </div>
    </div>

</html>
