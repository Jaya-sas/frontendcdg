<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //type-conversion :manually converting from one data type to other dta type
        console.log(Boolean(NaN))
        console.log(Boolean(1))

        console.log(String(3456))
        console.log("jaya")
        console.log(Number("jaya"))


        //type-corecion-  defaultly java scripts converts from one data type to other data type
        console.log("5"-3)
        console.log("9"/3)
        console.log("5"+3)  //here concatination

        //typeof

        console.log(typeof(null)) //object

    
        console.log(typeof(undefined)) //undefined
        console.log(typeof(42)) //number
        console.log(typeof("hello")) //string
        console.log(typeof(true)) //boolean
    </script>
</body>
</html>
