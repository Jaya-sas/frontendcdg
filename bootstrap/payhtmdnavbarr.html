<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paytm Navbar Clone</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* Navbar container */
.navbar {
    background: #fff;
    padding: 12px 60px;   /* IMPORTANT: spacing like Paytm */
    border-bottom: 1px solid #eee;
}

/* Logo */
.logo {
    font-size: 20px;
    font-weight: 700;
    color: #002970;
    display: flex;
    align-items: center;
    gap: 5px;
}

/* Nav links */
.nav-link {
    font-size: 15px;
    font-weight: 600;   /* bold like Paytm */
    color: #1d1d1d !important;
    margin: 0 12px;     /* spacing between items */
}

/* Dropdown arrow spacing */
.nav-link::after {
    margin-left: 6px;
}

/* Right section */
.right-section {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* Download app */
.download {
    color: #002970;
    font-weight: 500;
    text-decoration: none;
}

/* Sign in button */
.signin-btn {
    background: #002970;
    color: #fff;
    padding: 6px 18px;
    border-radius: 25px;
    font-weight: 600;
    border: none;
}

/* Hover effect */
.nav-link:hover {
    color: #00baf2 !important;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">

    <!-- Logo -->
    <div class="logo">
        Paytm ❤️ UPI
    </div>

    <!-- Toggle -->
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="nav">

      <ul class="navbar-nav mx-auto">  <!-- center alignment -->

        <li class="nav-item">
          <a class="nav-link dropdown-toggle" href="#">Recharge & Bills</a>
        </li>

        <li class="nav-item">
          <a class="nav-link dropdown-toggle" href="#">Ticket Booking</a>
        </li>

        <li class="nav-item">
          <a class="nav-link dropdown-toggle" href="#">Payments & Services</a>
        </li>

        <li class="nav-item">
          <a class="nav-link dropdown-toggle" href="#">Paytm for Business</a>
        </li>

        <li class="nav-item">
          <a class="nav-link dropdown-toggle" href="#">Company</a>
        </li>

      </ul>

      <!-- Right Side -->
      <div class="right-section">

        <a href="#" class="download">⬇ Download App</a>

        <button class="signin-btn">
          👤 Sign In
        </button>

      </div>

    </div>

  </div>
</nav>

</body>
</html>
